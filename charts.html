  <script defer src="assets/chart-noise.js?v=20261030-autojudge"></script><script defer src="assets/chart-engine.js?v=20261030-autojudge"></script><script defer src="assets/chart-player.js?v=20261030-autojudge"></script><body><header class="topbar"><a class="brand" href="index.html">φ PHI PRISM</a><span>谱面查询 / 读谱练习</span></header><main><div class="chart-browser"><aside class="panel"><h2>谱面库</h2><input id="query" placeholder="搜索曲名、曲师"><select id="chapter"><option value="">全部章节</option></select><select id="difficulty"><option>IN</option><option>EZ</option><option>HD</option><option>AT</option></select><select id="sort"><option value="chapter">章节顺序</option><option value="asc">定数从低到高</option><option value="desc">定数从高到低</option><option value="title">曲名</option></select><p id="count"></p><div id="songs"></div></aside><section><h1 id="title">选择一首歌曲</h1><p id="status" role="status">谱面与音频独立加载，本地优先，缺失时使用外部资源。</p><div id="stage"><canvas id="screen" width="1280" height="720"></canvas></div><audio id="audio" preload="auto"></audio><div class="controls"><button id="play" class="btn primary" disabled>播放</button><button id="restart" class="btn">从头</button><button id="back" class="btn">−5 秒</button><button id="forward" class="btn">+5 秒</button><button id="fullscreen" class="btn">全屏</button></div><input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="播放进度"><p id="time">0:00 / 0:00</p><div class="controls"><label><input id="autoJudge" type="checkbox" checked>机打效果</label><label><input id="noise" type="checkbox" checked>显示噪域</label><label>播放倍速 <select id="rate"><option>0.25</option><option>0.5</option><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option><option>2</option></select></label><label><input id="pitch" type="checkbox" checked>保持音调</label><label>音符流速 <input id="speed" type="range" min="0.5" max="2" step="0.05" value="1"></label><label>击打音量 <input id="hits" type="range" min="0" max="0.8" step="0.05" value="0.2"></label><label>音量 <input id="volume" type="range" min="0" max="1" step="0.05" value="0.7"></label><label>背景亮度 <input id="brightness" type="range" min="0" max="0.6" step="0.05" value="0.2"></label><label>音符大小 <input id="size" type="range" min="0.5" max="1.5" step="0.05" value="1"></label></div><div class="controls"><button class="btn" id="markA">设 A</button><button class="btn" id="markB">设 B</button><label><input id="loop" type="checkbox">区间循环</label><span id="interval">A — / B —</span></div><p>空格播放/暂停，左右键前后跳转。点击“全屏”后，Esc 可退出。</p><p>离线下载：运行 tools/download_resources.py。也可直接选择自己的官谱 JSON 和对应音频。</p><label>导入谱面 <input type="file" id="chartFile" accept=".json"></label><label>导入音频 <input type="file" id="audioFile" accept="audio/*"></label></section></div></main></body></html>
